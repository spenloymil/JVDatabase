<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fantasy Drag Race · Queen Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0c1210; --panel:#121b17; --card:#16211c; --border:#233830; --border2:#33513f;
    --lime:#9be564; --lime-dim:#5f8f3f; --text:#eaf5e6; --muted:#7a9284; --faint:#1c2b24;
    --winner:#9be564; --second:#e8d94a; --low:#ef6f6f;
  }

  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif;
    min-height:100vh; cursor:default;
  }

  .wrap{max-width:900px;margin:0 auto;padding:0 1.5rem 5rem;display:none}

  /* ── Hero ── */
  .hero{padding:3rem 0 2rem}
  .top{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
  .top .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
  h1{font-weight:700;font-size:clamp(1.7rem,4vw,2.2rem);letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.85rem;font-family:'JetBrains Mono',monospace}

  /* ── Nav ── */
  .nav-tabs{display:flex;gap:.5rem;margin-bottom:.5rem}
  .nav-tab{
    font-size:.85rem; font-weight:600; color:var(--muted); padding:.5rem .2rem; cursor:pointer;
    border-bottom:2px solid transparent; transition:.15s;
  }
  .nav-tab.active{color:var(--lime);border-bottom-color:var(--lime)}
  .nav-tab:hover:not(.active){color:var(--text)}

  /* ── Search ── */
  .search-row{display:flex;gap:.6rem;margin:1.75rem 0 1rem}
  input[type=text]{
    flex:1; background:var(--panel); border:1.5px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'Space Grotesk'; font-size:.95rem; padding:.75rem .95rem; outline:none;
    transition:border-color .2s;
  }
  input[type=text]::placeholder{color:var(--muted)}
  input[type=text]:focus{border-color:var(--lime)}

  /* ── Toolbar (franchise tabs + season + sort) ── */
  .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1.25rem}
  .tab{
    background:var(--panel); border:1.5px solid var(--border); color:var(--muted);
    font-size:.78rem; font-weight:500; padding:.45rem .9rem; border-radius:9px; cursor:pointer;
    font-family:'Space Grotesk'; transition:.15s;
  }
  .tab.active{background:var(--lime);color:#0c1210;border-color:var(--lime)}
  .tab:hover:not(.active){border-color:var(--border2)}

  select{
    background:var(--panel); border:1.5px solid var(--border); color:var(--text);
    font-family:'Space Grotesk'; font-size:.8rem; padding:.55rem .8rem; border-radius:9px; outline:none;
  }
  #seasonSelect{ }
  #sortSelect{margin-left:auto}

  /* ── Stats ── */
  .stats-row{display:flex;gap:.7rem;margin-bottom:1.75rem;flex-wrap:wrap}
  .stat{background:var(--panel);border:1.5px solid var(--border);border-radius:10px;padding:.6rem 1rem;flex:1;min-width:100px}
  .stat .n{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1.25rem;color:var(--lime)}
  .stat .l{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  .results-label{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;font-family:'JetBrains Mono',monospace}

  /* ── Detailed queen cards ── */
  .queens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1rem}

  .queen-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;transition:border-color .15s}
  .queen-card:hover{border-color:var(--border2)}

  .name-row{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.15rem}
  .name{font-weight:700;font-size:1.2rem;line-height:1.25}
  .crown{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;color:var(--winner);flex-shrink:0;white-space:nowrap}

  .card-stats{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.9rem}

  .season-table{
    display:grid; grid-template-columns:1fr auto auto; column-gap:.7rem; row-gap:.4rem; align-items:center;
    padding-top:.7rem; border-top:1px solid var(--border);
  }
  .st-head{
    font-size:.62rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  }
  .st-head.st-right{text-align:right}
  .s-name{color:var(--text);font-size:.87rem;line-height:1.3}
  .s-cw{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);text-align:right;white-space:nowrap}
  .placement{
    font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;text-transform:uppercase;
    padding:.15rem .55rem;border-radius:6px;color:var(--muted);white-space:nowrap;text-align:center;
    background:rgba(255,255,255,.04);
  }
  .placement.winner{color:var(--winner);background:rgba(155,229,100,.12)}
  .placement.second{color:var(--second);background:rgba(232,217,74,.12)}
  .placement.low{color:var(--low);background:rgba(239,111,111,.1)}

  /* ── Compact browse grid ── */
  .browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
  .browse-card{
    background:var(--panel); border:1.5px solid var(--border); border-radius:10px; padding:.85rem 1rem;
    cursor:pointer; transition:border-color .15s;
  }
  .browse-card:hover{border-color:var(--lime)}
  .browse-card:hover .bc-name{color:var(--lime)}
  .bc-name{font-weight:700;font-size:.95rem;transition:color .15s;margin-bottom:.15rem}
  .bc-stat{font-size:.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace}

  /* ── Empty state ── */
  .empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
  .empty-icon{font-size:2rem;margin-bottom:.6rem}

  /* ── Hall of Fame ── */
  .hof-toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1.75rem}
  .hof-franchise-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:.3rem}

  .timeline{position:relative;padding-left:1.9rem}
  .timeline::before{
    content:''; position:absolute; left:6px; top:.5rem; bottom:.5rem; width:2px;
    background:linear-gradient(var(--border2),var(--border2) 90%,transparent);
  }
  .tl-item{position:relative;padding-bottom:1.9rem}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{
    position:absolute; left:-1.9rem; top:.35rem; width:14px; height:14px; border-radius:50%;
    background:var(--bg); border:2.5px solid var(--lime); box-shadow:0 0 8px rgba(155,229,100,.4);
  }
  .tl-dot.no-winner{border-color:var(--border2);box-shadow:none}

  .tl-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:1.1rem 1.35rem}
  .tl-meta{display:flex;align-items:center;gap:.55rem;margin-bottom:.6rem;flex-wrap:wrap}
  .tl-season{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.03em}
  .tl-franchise{
    font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--lime-dim);background:rgba(155,229,100,.08);
    border:1px solid rgba(155,229,100,.2);border-radius:6px;padding:.1rem .5rem;
  }
  .tl-winner-row{display:flex;align-items:center;gap:.55rem;margin-bottom:.15rem}
  .tl-crown{font-size:1.3rem;line-height:1}
  .tl-winner{font-weight:700;font-size:1.3rem;color:var(--text);line-height:1.2}
  .tl-winner.none{color:var(--muted);font-weight:500;font-size:1rem;font-style:italic}
  .tl-runnerup{font-size:.78rem;color:var(--muted);padding-left:2rem}
  .tl-runnerup b{color:var(--muted);font-weight:600}

  /* ── Admin modal ── */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(4,8,6,.85);backdrop-filter:blur(6px);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{
    background:var(--card); border:1.5px solid var(--border2); border-radius:16px; padding:2rem 2.2rem;
    width:100%; max-width:440px; transform:translateY(14px); transition:transform .2s;
  }
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal h2{font-weight:700;font-size:1.5rem;color:var(--lime);margin-bottom:.3rem}
  .modal-sub{color:var(--muted);font-size:.82rem;margin-bottom:1.5rem}
  .field-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:.4rem;display:block}
  .field-input{
    width:100%; background:var(--panel); border:1.5px solid var(--border); border-radius:9px; color:var(--text);
    font-family:'Space Grotesk'; font-size:.95rem; padding:.7rem .9rem; outline:none; margin-bottom:1rem;
  }
  .field-input:focus{border-color:var(--lime)}
  .btn-primary{
    background:var(--lime); border:none; border-radius:9px; color:#0c1210; font-family:'Space Grotesk';
    font-size:.95rem; font-weight:700; padding:.75rem 1.5rem; cursor:pointer; width:100%; transition:opacity .15s;
  }
  .btn-primary:hover{opacity:.9}
  .error-msg{font-size:.8rem;color:var(--low);margin-top:-.6rem;margin-bottom:.7rem;min-height:1rem}

  .toast{
    position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(16px);background:var(--panel);
    border:1.5px solid var(--border2);border-radius:24px;padding:.6rem 1.3rem;font-size:.85rem;color:var(--text);
    opacity:0;transition:opacity .25s,transform .25s;z-index:300;white-space:nowrap;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<div class="wrap" id="appWrap">
  <div class="hero">
    <div class="top"><span class="dot"></span><h1>Queen Database</h1></div>
    <div class="sub">// july &amp; vivianna's fantasy drag race franchise</div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <span class="nav-tab active" data-view="database" onclick="setView('database')">Database</span>
    <span class="nav-tab" data-view="hof" onclick="setView('hof')">Hall of Fame</span>
  </div>

  <div id="databaseView">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="search queens by name..." autocomplete="off" spellcheck="false"/>
    </div>

    <div class="toolbar" id="toolbar"></div>

    <div class="stats-row" id="statsBar"></div>

    <div class="results-label" id="resultsLabel"></div>
    <div id="queensContainer"></div>
  </div>

  <div id="hofView" style="display:none">
    <div class="hof-toolbar" id="hofToolbar"></div>
    <div id="hofContainer"></div>
  </div>
</div>

<div class="modal-overlay open" id="modalOverlay">
  <div class="modal">
    <h2>Enter the Werk Room</h2>
    <p class="modal-sub">This area is for the production team only.</p>
    <label class="field-label" for="codeInput">Secret Code</label>
    <input class="field-input" type="password" id="codeInput" placeholder="••••••" onkeydown="if(event.key==='Enter')checkCode()"/>
    <div class="error-msg" id="codeError"></div>
    <button class="btn-primary" onclick="checkCode()">Unlock</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let QUEENS = [];
let SEASON_ORDER = [];
const SECRET = "SPORKY";
let authenticated = false;

/* filter/sort state */
let searchQuery = "";
let selectedFranchise = "All";
let selectedSeason = "All";
let sortMode = "name";

/* view state */
let currentView = "database";   // "database" | "hof"
let hofMode = "timeline";       // "timeline" | "franchise"
let hofFranchise = null;

/* ── Franchise / season derivation (nothing hardcoded — computed from whatever's in queens.json) ── */

function franchiseOf(seasonName) {
  const s = String(seasonName || "").trim();
  if (/^Season\s+\d+$/i.test(s)) return "Regular Season";
  let m = s.match(/^(.*?)\s+Season\s*\d+$/i);
  if (m && m[1]) return m[1].trim();
  m = s.match(/^(.*?)\s+\d+$/);
  if (m && m[1]) return m[1].trim();
  return s;
}

function getAllSeasonEntries() {
  // flat list of { season, franchise } across every queen's every appearance
  const seen = new Map();
  QUEENS.forEach(q => (q.seasons || []).forEach(s => {
    if (s.season && !seen.has(s.season)) seen.set(s.season, franchiseOf(s.season));
  }));
  return seen;
}

function getFranchiseList() {
  const entries = getAllSeasonEntries();
  const set = new Set(entries.values());
  const list = [...set];
  list.sort((a, b) => {
    if (a === "Regular Season") return -1;
    if (b === "Regular Season") return 1;
    return a.localeCompare(b);
  });
  return list;
}

function naturalSeasonSort(a, b) {
  const numA = (a.match(/(\d+)(?!.*\d)/) || [])[1];
  const numB = (b.match(/(\d+)(?!.*\d)/) || [])[1];
  const fA = franchiseOf(a), fB = franchiseOf(b);
  if (fA !== fB) return fA.localeCompare(fB);
  if (numA && numB) return parseInt(numA) - parseInt(numB);
  if (numA && !numB) return 1;
  if (!numA && numB) return -1;
  return a.localeCompare(b);
}

function getSeasonsForFranchise(franchise) {
  const entries = getAllSeasonEntries();
  let seasons = [...entries.keys()];
  if (franchise !== "All") seasons = seasons.filter(s => entries.get(s) === franchise);
  seasons.sort(naturalSeasonSort);
  return seasons;
}

/* ── Placement styling (visual only — not used for filtering) ── */

function placementClass(p) {
  const l = String(p || "").toLowerCase();
  if (l.includes("winner") || l.startsWith("1st")) return "winner";
  if (l.includes("runner") || l.includes("2nd")) return "second";
  if (l.includes("elim") || l.includes("bottom")) return "low";
  return "";
}

function winCount(queen) {
  return (queen.seasons || []).filter(s => placementClass(s.placement) === "winner").length;
}
function challengeWinTotal(queen) {
  return (queen.seasons || []).reduce((a, s) => a + (Number(s.challenge_wins) || 0), 0);
}
function queenFranchises(queen) {
  const set = new Set((queen.seasons || []).map(s => franchiseOf(s.season)));
  return [...set];
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ── Hall of Fame ── */

// Defensive: if a season exists in the data but wasn't in season_order (e.g. someone
// hand-edited the JSON), tack it on the end rather than silently dropping it.
function getEffectiveSeasonOrder() {
  const known = new Set(SEASON_ORDER);
  const missing = [...getAllSeasonEntries().keys()].filter(s => !known.has(s));
  missing.sort(naturalSeasonSort);
  return [...SEASON_ORDER, ...missing];
}

function seasonResult(seasonName) {
  const winners = [];
  const runnerups = [];
  QUEENS.forEach(q => (q.seasons || []).forEach(s => {
    if (s.season !== seasonName) return;
    const cls = placementClass(s.placement);
    if (cls === "winner") winners.push(q.name);
    else if (cls === "second") runnerups.push(q.name);
  }));
  return { winners, runnerups };
}

function setView(view) {
  currentView = view;
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
  document.getElementById("databaseView").style.display = view === "database" ? "block" : "none";
  document.getElementById("hofView").style.display = view === "hof" ? "block" : "none";
  if (view === "hof") renderHof();
}

function setHofMode(mode) {
  hofMode = mode;
  if (mode === "franchise" && !hofFranchise) {
    hofFranchise = getFranchiseList()[0] || null;
  }
  renderHof();
}

function setHofFranchise(f) {
  hofFranchise = f;
  renderHof();
}

function renderHofToolbar() {
  const toolbar = document.getElementById("hofToolbar");
  const franchises = getFranchiseList();

  const franchiseTabsHTML = hofMode === "franchise"
    ? `<div class="hof-franchise-tabs">${
        franchises.map(f => `<span class="tab ${f === hofFranchise ? "active" : ""}" onclick="setHofFranchise('${f.replace(/'/g, "\\'")}')">${f}</span>`).join("")
      }</div>`
    : "";

  toolbar.innerHTML = `
    <span class="tab ${hofMode === "timeline" ? "active" : ""}" onclick="setHofMode('timeline')">Timeline</span>
    <span class="tab ${hofMode === "franchise" ? "active" : ""}" onclick="setHofMode('franchise')">By Franchise</span>
    ${franchiseTabsHTML}
  `;
}

function renderHof() {
  renderHofToolbar();
  const container = document.getElementById("hofContainer");
  const order = getEffectiveSeasonOrder();
  const seasons = hofMode === "franchise" && hofFranchise
    ? order.filter(s => franchiseOf(s) === hofFranchise)
    : order;

  if (!seasons.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">👑</div><p>No seasons recorded yet.</p></div>`;
    return;
  }

  container.innerHTML = `<div class="timeline">${
    seasons.map(season => {
      const { winners, runnerups } = seasonResult(season);
      const hasWinner = winners.length > 0;
      const winnerHTML = hasWinner
        ? `<div class="tl-winner-row"><span class="tl-crown">👑</span><span class="tl-winner">${winners.join(" & ")}</span></div>`
        : `<div class="tl-winner-row"><span class="tl-winner none">No winner recorded</span></div>`;
      const runnerupHTML = runnerups.length
        ? `<div class="tl-runnerup"><b>Runner-up:</b> ${runnerups.join(" & ")}</div>`
        : "";

      return `
        <div class="tl-item">
          <span class="tl-dot ${hasWinner ? "" : "no-winner"}"></span>
          <div class="tl-card">
            <div class="tl-meta">
              <span class="tl-season">${season}</span>
              <span class="tl-franchise">${franchiseOf(season)}</span>
            </div>
            ${winnerHTML}
            ${runnerupHTML}
          </div>
        </div>`;
    }).join("")
  }</div>`;
}

/* ── Toolbar (franchise tabs + season select + sort select) ── */

function renderToolbar() {
  const toolbar = document.getElementById("toolbar");
  const franchises = getFranchiseList();

  const tabsHTML = ["All", ...franchises].map(f => `
    <span class="tab ${f === selectedFranchise ? "active" : ""}" onclick="setFranchise('${f.replace(/'/g, "\\'")}')">${f}</span>
  `).join("");

  const seasonOptions = ["All", ...getSeasonsForFranchise(selectedFranchise)];
  const seasonHTML = seasonOptions.map(s => `<option value="${s}" ${s === selectedSeason ? "selected" : ""}>${s === "All" ? "All seasons" : s}</option>`).join("");

  toolbar.innerHTML = `
    ${tabsHTML}
    <select id="seasonSelect" onchange="setSeason(this.value)">${seasonHTML}</select>
    <select id="sortSelect" onchange="setSort(this.value)">
      <option value="name" ${sortMode === "name" ? "selected" : ""}>Sort: A–Z</option>
      <option value="wins" ${sortMode === "wins" ? "selected" : ""}>Sort: Most wins</option>
      <option value="appearances" ${sortMode === "appearances" ? "selected" : ""}>Sort: Most appearances</option>
      <option value="challenge" ${sortMode === "challenge" ? "selected" : ""}>Sort: Most challenge wins</option>
    </select>
  `;
}

function setFranchise(f) {
  selectedFranchise = f;
  selectedSeason = "All";
  renderToolbar();
  render();
}
function setSeason(s) {
  selectedSeason = s;
  render();
}
function setSort(s) {
  sortMode = s;
  render();
}

/* ── Filtering + sorting ── */

function getFilteredSorted() {
  let result = QUEENS.filter(q => {
    if (searchQuery && !q.name.toLowerCase().includes(searchQuery)) return false;
    if (selectedFranchise !== "All" || selectedSeason !== "All") {
      const matches = (q.seasons || []).some(s => {
        if (selectedSeason !== "All") return s.season === selectedSeason;
        return franchiseOf(s.season) === selectedFranchise;
      });
      if (!matches) return false;
    }
    return true;
  });

  result.sort((a, b) => {
    if (sortMode === "wins") return winCount(b) - winCount(a) || a.name.localeCompare(b.name);
    if (sortMode === "appearances") return (b.seasons || []).length - (a.seasons || []).length || a.name.localeCompare(b.name);
    if (sortMode === "challenge") return challengeWinTotal(b) - challengeWinTotal(a) || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  });

  return result;
}

/* ── Render ── */

function render() {
  const container = document.getElementById("queensContainer");
  const label = document.getElementById("resultsLabel");
  const statsBar = document.getElementById("statsBar");

  const totalSeasons = QUEENS.reduce((a, q) => a + (q.seasons || []).length, 0);
  const winners = QUEENS.filter(q => winCount(q) > 0).length;
  const totalChallengeWins = QUEENS.reduce((a, q) => a + challengeWinTotal(q), 0);

  statsBar.innerHTML = `
    <div class="stat"><div class="n">${QUEENS.length}</div><div class="l">queens</div></div>
    <div class="stat"><div class="n">${totalSeasons}</div><div class="l">appearances</div></div>
    <div class="stat"><div class="n">${winners}</div><div class="l">winners</div></div>
    <div class="stat"><div class="n">${totalChallengeWins}</div><div class="l">challenge wins</div></div>
  `;

  const filtersActive = searchQuery !== "" || selectedFranchise !== "All" || selectedSeason !== "All";
  const results = getFilteredSorted();

  if (!filtersActive) {
    label.textContent = `All ${results.length} queens`;
    container.innerHTML = `<div class="browse-grid">${
      results.map(q => `
        <div class="browse-card" onclick="searchFor('${q.name.replace(/'/g, "\\'")}')">
          <div class="bc-name">${q.name}</div>
          <div class="bc-stat">${(q.seasons || []).length} appearance${(q.seasons || []).length !== 1 ? "s" : ""}</div>
        </div>`).join("")
    }</div>`;
    return;
  }

  label.textContent = results.length ? `${results.length} queen${results.length !== 1 ? "s" : ""} found` : "";

  if (!results.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <p>No queens match those filters.</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="queens-grid">${
    results.map(q => {
      const seasons = q.seasons || [];
      const wins = winCount(q);
      const cwTotal = challengeWinTotal(q);

      const statsLine = [
        `${seasons.length} appearance${seasons.length !== 1 ? "s" : ""}`,
        cwTotal ? `${cwTotal} challenge win${cwTotal !== 1 ? "s" : ""}` : null
      ].filter(Boolean).join(" · ");

      const rowsHTML = seasons.map(s => `
        <span class="s-name">${s.season}</span>
        <span class="placement ${placementClass(s.placement)}">${s.placement || "—"}</span>
        <span class="s-cw">${Number(s.challenge_wins) || 0}★</span>
      `).join("");

      return `
        <div class="queen-card">
          <div class="name-row">
            <div class="name">${q.name}</div>
            ${wins ? `<div class="crown">👑 ×${wins}</div>` : ""}
          </div>
          <div class="card-stats">${statsLine}</div>
          <div class="season-table">
            <span class="st-head">Season</span>
            <span class="st-head st-right">Placement</span>
            <span class="st-head st-right">★</span>
            ${rowsHTML}
          </div>
        </div>`;
    }).join("")
  }</div>`;
}

function searchFor(name) {
  document.getElementById("searchInput").value = name;
  searchQuery = name.toLowerCase();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

async function loadQueens() {
  try {
    const res = await fetch("queens.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`Failed to load queens.json (${res.status})`);
    const data = await res.json();

    if (Array.isArray(data)) {
      // old format: plain array of queens, no stored season order
      QUEENS = data;
      SEASON_ORDER = [];
    } else {
      QUEENS = Array.isArray(data.queens) ? data.queens : [];
      SEASON_ORDER = Array.isArray(data.season_order) ? data.season_order : [];
    }

    renderToolbar();
    render();
  } catch (err) {
    console.error(err);
    showToast("Could not load queens.json");
    document.getElementById("queensContainer").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <p>Could not load queens.json</p>
      </div>`;
  }
}

async function checkCode() {
  const val = document.getElementById("codeInput").value;
  if (val === SECRET) {
    authenticated = true;
    document.getElementById("codeError").textContent = "";
    document.getElementById("modalOverlay").classList.remove("open");
    document.getElementById("appWrap").style.display = "block";
    await loadQueens();
    setTimeout(() => document.getElementById("searchInput").focus(), 50);
  } else {
    document.getElementById("codeError").textContent = "Wrong code. Try again.";
    document.getElementById("codeInput").value = "";
    document.getElementById("codeInput").focus();
  }
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("appWrap").style.display = "none";
  document.getElementById("modalOverlay").classList.add("open");
  document.getElementById("codeInput").focus();
});
</script>
</body>
</html>
